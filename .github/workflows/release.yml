name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"
  QT_ARCH: "win64_msvc2022_64"

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            bridge -> target

      # No artifact is produced unless every check below passes. A release that
      # does not build is worse than no release, because it is discoverable.
      - name: Check the engine
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Check the bridge
        working-directory: bridge
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.1.18"
          aqt install-qt windows desktop "$env:QT_VERSION" "$env:QT_ARCH" -O "$env:RUNNER_TEMP\Qt"
          "QT_DIR=$env:RUNNER_TEMP\Qt\$env:QT_VERSION\$env:QT_ARCH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and test natively
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug --output-on-failure

      - name: Build
        run: cmake --build --preset release

      - name: Package
        run: cmake --build --preset release --target installer portable

      - name: Checksums
        shell: pwsh
        run: |
          $package = "build/release/package"
          $lines = Get-ChildItem $package -File |
            Where-Object { $_.Extension -in ".exe", ".zip" } |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            }
          $lines | Out-File -FilePath "$package/SHA256SUMS.txt" -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }

      - name: Verify the executable starts
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/release/bin/VYNX QR.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "exited with $($process.ExitCode)" }
          if (-not $process.MainWindowHandle) { throw "no window" }
          $children = (Get-CimInstance Win32_Process |
            Where-Object { $_.ParentProcessId -eq $process.Id }).Count
          if ($children -ne 0) { throw "expected one process, found $children children" }
          Stop-Process -Id $process.Id -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vynx-qr-release
          path: build/release/package/*
          if-no-files-found: error

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/package/*
          draft: true
          generate_release_notes: true
          body: |
            ## VYNX QR

            Native Windows build: one process, no web view, no telemetry.

            * `VYNX-QR-Setup-x64-*.exe` — per-user installer
            * `VYNX-QR-Portable-x64-*.zip` — run it from anywhere
            * `SHA256SUMS.txt` — verify with `sha256sum -c`

            Qt is dynamically linked under the LGPL; see
            `THIRD_PARTY_LICENSES.md`.