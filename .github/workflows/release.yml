name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"
  QT_ARCH: "win64_msvc2022_64"
  QT_INSTALL_DIR: "msvc2022_64"

jobs:
  platform-validation:
    name: Native Linux builds and artifact tests
    uses: ./.github/workflows/ci.yml

  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            bridge -> ../build/release/cargo

      # No artifact is produced unless every check below passes. A release that
      # does not build is worse than no release, because it is discoverable.
      - name: Check the engine
        working-directory: core
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test

      - name: Check the bridge
        working-directory: bridge
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0"
          aqt version
          aqt install-qt windows desktop "$env:QT_VERSION" "$env:QT_ARCH" -O "$env:RUNNER_TEMP\Qt"
          # QTDIR is the variable the CMake presets read. Writing it through
          # GITHUB_ENV makes it a real environment variable for the following
          # steps. The workflow level "env: QTDIR: ${{ env.QT_DIR }}" does not:
          # the env context only covers what the workflow itself declared, not
          # what an earlier step exported.
          # The aqt architecture includes win64_; the extracted directory does not.
          $qtDir = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\$env:QT_INSTALL_DIR"
          if (-not (Test-Path -LiteralPath "$qtDir\lib\cmake\Qt6\Qt6Config.cmake")) {
            throw "Qt6Config.cmake was not found under $qtDir"
          }
          "QTDIR=$qtDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NSIS
        # Not assumed to be present. The hosted Windows images list Inno Setup and
        # WiX, and makensis is not guaranteed, so a release must not depend on it
        # being there by luck.
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path -LiteralPath "$nsisDir\makensis.exe")) {
            throw "makensis.exe was not found under $nsisDir"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify makensis
        run: makensis /VERSION

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test the bridge and the window
        run: ctest --preset release --output-on-failure

      - name: Package
        run: cmake --build --preset release --target installer portable

      - name: Checksums
        shell: pwsh
        run: |
          $package = "build/release/package"
          $installer = @(Get-ChildItem "$package/VYNX-QR-Setup-x64-*.exe" -File)
          $portable = @(Get-ChildItem "$package/VYNX-QR-Portable-x64-*.zip" -File)
          if ($installer.Count -ne 1 -or $portable.Count -ne 1) {
            throw "Expected exactly one installer and one portable archive"
          }
          $lines = @($installer[0], $portable[0]) |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            }
          $lines | Out-File -FilePath "$package/SHA256SUMS.txt" -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }

      - name: Verify the executable starts
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/release/bin/VYNX QR.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "exited with $($process.ExitCode)" }
          if (-not $process.MainWindowHandle) { throw "no window" }
          $children = (Get-CimInstance Win32_Process |
            Where-Object { $_.ParentProcessId -eq $process.Id }).Count
          if ($children -ne 0) { throw "expected one process, found $children children" }
          Stop-Process -Id $process.Id -Force

      # Keeping the logs makes a failure diagnosable without re-running, and
      # re-running costs a Qt download.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.job }}
          path: |
            build/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vynx-qr-release
          path: |
            build/release/package/VYNX-QR-Setup-x64-*.exe
            build/release/package/VYNX-QR-Portable-x64-*.zip
            build/release/package/SHA256SUMS.txt
          if-no-files-found: error

  installer-smoke:
    name: Installed package smoke (${{ matrix.runner }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Download installer from this Actions run
        uses: actions/download-artifact@v4
        with:
          name: vynx-qr-release
          path: artifacts

      - name: Install, launch and uninstall
        shell: pwsh
        run: ./scripts/installer-smoke.ps1 -ArtifactDirectory artifacts

      - name: Test downloaded portable archive
        shell: pwsh
        run: ./scripts/portable-smoke.ps1 -ArtifactDirectory artifacts

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-${{ matrix.runner }}
          path: |
            installer-smoke-report.json
            portable-smoke-report.json
            portable-runtime-smoke.json
          if-no-files-found: warn

  collect:
    name: Collect five verified public packages
    needs: [release, installer-smoke, platform-validation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vynx-qr-release
          path: artifacts/vynx-qr-release
      - uses: actions/download-artifact@v4
        with:
          name: debian-deb
          path: artifacts/debian-deb
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: artifacts/arch-package
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/linux-appimage
      - run: python3 scripts/collect-release.py --input artifacts --output public
      - uses: actions/upload-artifact@v4
        with:
          name: vynx-qr-public
          path: public/*
          if-no-files-found: error

  publish:
    name: Publish tested release draft
    needs: collect
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches the single product version
        run: test "$GITHUB_REF_NAME" = "v$(python3 scripts/project-version.py)"
      - uses: actions/download-artifact@v4
        with:
          name: vynx-qr-public
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VYNX-QR-Setup-x64-*.exe
            artifacts/VYNX-QR-Portable-x64-*.zip
            artifacts/vynx-qr_*_amd64.deb
            artifacts/vynx-qr-*-x86_64.pkg.tar.zst
            artifacts/VYNX-QR-*-x86_64.AppImage
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          body: |
            Native Qt Widgets application with the same Rust QR engine on Windows and Linux.
            No browser engine, telemetry, account or network client.

            Windows: per-user installer or portable ZIP.
            Linux x86_64: DEB, Arch package or self-contained AppImage.
            Verify downloads against SHA256SUMS.txt.

            Qt and Rust notices are included in every package; bundled Qt includes
            its corresponding source. See THIRD_PARTY_LICENSES.md.

            Windows installer and portable artifacts are tested on fresh GitHub Windows runners.
            Linux package artifacts are tested on fresh Debian, Ubuntu and Arch environments.
            Dedicated Windows 10 consumer-machine validation remains pending.
