name: CI

on:
  push:
    branches: [main, CI-fix, 1.1.0-update]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Qt point release cannot change what CI verifies.
  QT_VERSION: "6.8.3"
  QT_ARCH: "win64_msvc2022_64"
  QT_INSTALL_DIR: "msvc2022_64"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.crate }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate: [core, bridge]
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target

      - name: Formatting
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test

  native:
    name: Native build and window tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bridge -> ../build/release/cargo

      - name: Install Qt
        # aqtinstall is the mechanism used to produce the reference builds on the
        # development machine too, and it fetches the official binaries without
        # needing a Qt account. The version is pinned so a point release cannot
        # change what CI verifies.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0"
          aqt version
          aqt install-qt windows desktop "$env:QT_VERSION" "$env:QT_ARCH" -O "$env:RUNNER_TEMP\Qt"
          # QTDIR is the variable the CMake presets read. Writing it through
          # GITHUB_ENV makes it a real environment variable for the following
          # steps. The workflow level "env: QTDIR: ${{ env.QT_DIR }}" does not:
          # the env context only covers what the workflow itself declared, not
          # what an earlier step exported.
          # The aqt architecture includes win64_; the extracted directory does not.
          $qtDir = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\$env:QT_INSTALL_DIR"
          if (-not (Test-Path -LiteralPath "$qtDir\lib\cmake\Qt6\Qt6Config.cmake")) {
            throw "Qt6Config.cmake was not found under $qtDir"
          }
          "QTDIR=$qtDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The debug preset exists for quick iteration on the engine, but the window
      # tests cannot run there: a debug Qt build links the debug import libraries
      # while CMake still resolves Qt6Guid to its release one, and two Qt copies in
      # one process corrupt the heap. So the tested build is the release one, which
      # is also the thing that ships.
      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test the bridge and the window
        run: ctest --preset release --output-on-failure

      - name: Check the executable starts
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/release/bin/VYNX QR.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            Write-Error "VYNX QR exited immediately with $($process.ExitCode)"
            exit 1
          }
          if (-not $process.MainWindowHandle) {
            Write-Error "VYNX QR started but created no window"
            Stop-Process -Id $process.Id -Force
            exit 1
          }
          # The whole point of the migration: one process and no browser runtime.
          $children = (Get-CimInstance Win32_Process |
            Where-Object { $_.ParentProcessId -eq $process.Id }).Count
          Write-Host "window created; child processes: $children"
          if ($children -ne 0) {
            Write-Error "expected a single process, found $children children"
            Stop-Process -Id $process.Id -Force
            exit 1
          }
          Stop-Process -Id $process.Id -Force

      # Keeping the logs makes a failure diagnosable without re-running, and
      # re-running costs a Qt download.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.job }}
          path: |
            build/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: vynx-qr-native
          path: |
            build/release/bin/VYNX QR.exe
            build/release/bin/Qt6*.dll
            build/release/bin/platforms/
            build/release/bin/styles/
          if-no-files-found: error

  ubuntu:
    name: Ubuntu native build and window tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ qt6-base-dev qt6-base-dev-tools qt6-wayland xvfb xauth openbox wmctrl xdotool
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge -> ../build/linux-release/cargo
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release
      - run: xvfb-run -a ctest --preset linux-release
      - name: Native GUI launch
        run: xvfb-run -a python3 scripts/linux-window-smoke.py build/linux-release/bin/vynx-qr --report build/linux-release/window-smoke.json
      - name: Debug native build and tests
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          xvfb-run -a ctest --preset linux-debug
      - name: Build Debian package with system Qt
        run: |
          sudo apt-get install -y dpkg-dev desktop-file-utils
          desktop-file-validate packaging/linux/vynx-qr.desktop
          cmake --build --preset linux-release --target deb
          python3 scripts/verify-rust-notices.py build/linux-release/linux-docs/licenses/rust --target x86_64-unknown-linux-gnu --lockfile bridge/Cargo.lock
          cd build/linux-release/package
          sha256sum *.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: |
            build/linux-release/package/*.deb
            build/linux-release/package/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-native-evidence
          path: |
            build/linux-release/window-smoke.json
            build/linux-release/Testing/Temporary/
            build/linux-debug/Testing/Temporary/
            build/linux-release/bin/vynx-qr
          if-no-files-found: warn

  arch:
    name: Arch makepkg and Qt tests
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install native Arch build dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake ninja rust qt6-base qt6-wayland python git desktop-file-utils xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - name: Build using makepkg as an ordinary user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- python scripts/prepare-arch-package.py --output build/arch-package --build
          cd build/arch-package
          sha256sum vynx-qr-*.pkg.tar.zst > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            build/arch-package/vynx-qr-*.pkg.tar.zst
            build/arch-package/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-build-evidence
          path: |
            build/arch-package/PKGBUILD
            build/arch-package/source-commit.txt
            build/arch-package/src/vynx-qr/build/arch-release/Testing/Temporary/
          if-no-files-found: warn

  arch-smoke:
    name: Arch artifact install/run/remove
    needs: arch
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install runtime test infrastructure
        run: |
          pacman -Syu --noconfirm python git desktop-file-utils xorg-server-xvfb xorg-xauth openbox wmctrl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: artifacts
      - name: Test the actual artifact
        run: |
          useradd -m builder
          python scripts/arch-package-smoke.py artifacts/vynx-qr-*.pkg.tar.zst --manifest artifacts/SHA256SUMS.txt --report build/arch-smoke/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-smoke-evidence
          path: build/arch-smoke/
          if-no-files-found: warn

  deb-smoke:
    name: DEB from Actions install/run/remove
    needs: ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-deb
          path: artifacts
      - name: Install test infrastructure
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox wmctrl desktop-file-utils
      - name: Install, run and remove the actual artifact
        run: |
          python3 scripts/linux-package-smoke.py artifacts/*.deb --manifest artifacts/SHA256SUMS.txt --report build/deb-smoke/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-smoke-evidence
          path: build/deb-smoke/
          if-no-files-found: warn

  appimage:
    name: AppImage with official Qt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies and source repositories
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth desktop-file-utils dpkg-dev
      - name: Install official Qt SDK
        run: |
          python3 -m pip install 'aqtinstall==3.3.0'
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          echo "QTDIR=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge -> ../build/appimage/cargo
      - name: Build and test against bundled Qt version
        run: |
          cmake --preset linux-appimage
          cmake --build --preset linux-appimage
          xvfb-run -a ctest --preset linux-appimage
      - name: Package AppImage and notices
        run: |
          cmake --build --preset linux-appimage --target appimage
          cd build/appimage/package
          sha256sum *.AppImage > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            build/appimage/package/*.AppImage
            build/appimage/package/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-build-evidence
          path: |
            build/appimage/appimage-inventory.json
            build/appimage/Testing/Temporary/
          if-no-files-found: warn

  appimage-smoke:
    name: AppImage from Actions fresh-runner launch
    needs: appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts
      - name: Install runtime test infrastructure
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox wmctrl desktop-file-utils fuse3 libxcb-cursor0
      - name: Launch the actual AppImage without extraction fallback
        run: python3 scripts/appimage-smoke.py artifacts/*.AppImage --manifest artifacts/SHA256SUMS.txt --report build/appimage-smoke/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-smoke-evidence
          path: build/appimage-smoke/
          if-no-files-found: warn
