[package]
name = "vynx-qr"
version = "1.0.0"
description = "VYNX QR — fast, private QR codes for Windows."
authors = ["Maks0101aps"]
# Custom licence that cannot be expressed as an SPDX expression; see ../LICENSE.
license-file = "../LICENSE"
repository = "https://github.com/VYNX-Project/vynx-qr"
edition = "2021"
rust-version = "1.82"
default-run = "vynx-qr"

[lib]
name = "vynx_qr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# `winresource` writes the Windows resource object straight from Rust, with no
# dependency on `rc.exe`. `build.rs` falls back to it when `tauri-build`'s own
# resource compiler produced an empty object, which happens on machines that have
# no Microsoft resource compiler and a stub `llvm-rc` on PATH.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"

# QR matrix generation (pure Rust, MIT/Apache-2.0)
qrcode = { version = "0.14", default-features = false }
# QR decoding used by the built-in scan verification
rqrr = "0.11"
# Raster output and logo decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Windows clipboard (text read + DIB image write)
arboard = { version = "3", features = ["image-data"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
